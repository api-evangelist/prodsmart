name: Prodsmart
description: >-
  Prodsmart is a cloud manufacturing execution system (MES) and production
  management platform for small and mid-sized manufacturers, covering production
  tracking, inventory, sales and purchasing, quality, scheduling and material
  requirements, asset maintenance, and shop-floor analytics across mobile and
  desktop. Founded as Prodsmart and acquired by Autodesk in 2021, it is now
  offered as Autodesk Fusion Operations. It exposes a documented REST API (a
  deprecated v1 surface at fusionoperations.autodesk.com/api/v1 and a current v2
  API on Autodesk Platform Services), authenticated with an API Key/Secret via
  HTTP Basic that mints a 2-hour token, plus webhooks, a Changes Feed, and Zapier
  and Power BI integrations. This profile was surfaced as a portfolio company of
  500 Global and enriched by the API Evangelist pipeline.
