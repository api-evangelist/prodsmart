    - name: Webhooks
      style: HTTP callback
    - name: Changes Feed Channels
      style: pollable change feed
      operation: openapi/prodsmart-v1-openapi.yml#listChangesFeedChannels
  activation: Requires an API key (requested from the company profile).
events:
